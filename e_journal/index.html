<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>e-journal</title>

        <link rel="icon"
            type="image/svg+xml"
            href="favicon.svg">

    <link rel="stylesheet"
          href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="source.js"
            defer></script>
</head>

<body>

<button id="resetStorageButton">
    データ全削除
</button>

<div class="tabs">

    <button class="tab-button active"
            data-target="journal-tab">
        仕訳登録
    </button>

    <button class="tab-button"
            data-target="item-tab">
        勘定科目一覧
    </button>

    <button class="tab-button"
            data-target="history-tab">
        仕訳参照
    </button>

</div>

<!-- 仕訳登録 -->

<div id="journal-tab"
     class="tab-content active">

    <div class="card">

        <h2>仕訳登録</h2>

        <div>

            <label>
                発生日時
            </label>

            <input
                type="datetime-local"
                id="journalDatetime">

        </div>

        <br>
        <div>
            <label>メモ</label>
            <input type="text"
                   id="memo">
        </div>

        <h3>借方</h3>

        <div id="debits"></div>

        <button id="addDebit">
            借方追加
        </button>

        <hr>

        <h3>貸方</h3>

        <div id="credits"></div>

        <button id="addCredit">
            貸方追加
        </button>

        <hr>

        <button id="saveJournal">
            保存
        </button>

    </div>

</div>

<!-- 勘定科目 -->

<div id="item-tab"
     class="tab-content">

    <div class="card">

        <h2>勘定科目追加</h2>

        <div class="row">

            <input type="text"
                   id="newItemName"
                   placeholder="勘定科目名">

            <select id="newItemType">

                <option value="資産">資産</option>
                <option value="負債">負債</option>
                <option value="純資産">純資産</option>
                <option value="費用">費用</option>
                <option value="収益">収益</option>

            </select>

            <button id="addItem">
                追加
            </button>

        </div>

    </div>

    <div class="card">

        <h2>勘定科目一覧</h2>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>勘定科目</th>
                <th>区分</th>
                <th>現残高</th>
                <th>操作</th>
            </tr>
            </thead>

            <tbody id="itemTable">
            </tbody>

        </table>

    </div>

</div>

<!-- 仕訳一覧 -->

<div id="history-tab"
     class="tab-content">

    <div class="card">

        <h2>仕訳一覧</h2>

        <input
            type="date"
            id="journalDateFilter">

        <div id="journalTable">
        </div>

    </div>

</div>
<!-- 確認モーダル -->

<div id="confirmModal" class="modal">

    <div class="modal-content">

        <h2>仕訳確認</h2>

        <div id="confirmBody">
        </div>

        <div class="modal-buttons">

            <button id="confirmOk">
                登録
            </button>

            <button id="confirmCancel">
                キャンセル
            </button>

        </div>

    </div>

</div>

</body>
</html>
